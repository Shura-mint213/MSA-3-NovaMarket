http {
    # Зона для веб-приложения: до 50 запросов в секунду с одного IP
    limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;

    # Зона для мобильного приложения: до 30 запросов в секунду с одного IP
    limit_req_zone $binary_remote_addr zone=mobile:10m rate=30r/s;

    server {
        listen 80;

        # API для мобильного приложения
        location /api/mobile/ {
            limit_req zone=mobile burst=50 nodelay;
            proxy_pass http://backend/;
        }

        # API для веб-приложения
        location /api/web/ {
            limit_req zone=web burst=100 nodelay;
            proxy_pass http://backend/;
        }

        # Общий API (для обратной совместимости или по умолчанию)
        location /api/ {
            # По умолчанию применяем веб-лимиты
            limit_req zone=web burst=100 nodelay;
            proxy_pass http://backend/;
        }
    }
}